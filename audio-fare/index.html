<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Audio Fare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Capa: app de una pantalla. Ambiente 70% de fondo, principal 20% en texto y piezas clave, secundario 10% en acentos. Vidrio claro de esquinas cortadas intercalado con superficies opacas. */
:root{
  --amb:#ffffff; --pri:#000000; --sec:#8c8c8c;
  --paper:#f4f2ec; --ink:#161616; --slot:#141414;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --cut:14px; --rad:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --amb:#000000; --pri:#ffffff; --sec:#8c8c8c; color-scheme:dark } }
:root[data-theme="dark"]{ --amb:#000000; --pri:#ffffff; --sec:#8c8c8c; color-scheme:dark }
:root{
  --fg:var(--pri);
  --muted:color-mix(in srgb, var(--pri) 58%, var(--amb));
  --line:color-mix(in srgb, var(--pri) 14%, var(--amb));
  --solid:color-mix(in srgb, var(--pri) 5%, var(--amb));
  --glass:color-mix(in srgb, var(--amb) 30%, transparent);
  --edge:color-mix(in srgb, var(--pri) 26%, transparent);
}
/* Reproductor teñido con el color de la portada */
.app.tinted[data-view="np"]{--amb:var(--npbg);--pri:var(--npfg);--sec:var(--npacc);
  --fg:var(--pri);--muted:color-mix(in srgb, var(--pri) 62%, var(--amb));--line:color-mix(in srgb, var(--pri) 18%, var(--amb));
  --solid:color-mix(in srgb, var(--pri) 8%, var(--amb));--glass:color-mix(in srgb, var(--amb) 30%, transparent);--edge:color-mix(in srgb, var(--pri) 26%, transparent);
  background:var(--amb);color:var(--fg)}
.app{transition:background-color .6s ease}
.app.tinted[data-view="np"] .back{background:linear-gradient(var(--amb) 70%,transparent)}
.cover.art{background:var(--solid)}
.cover.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@property --rx{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --ry{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --gx{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --gy{syntax:'<percentage>';inherits:true;initial-value:50%}
html,body{height:100%}
html{overflow:hidden}
/* Tilt 3D con brillo: estilo predominante */
.tl{transform:perspective(var(--pp,700px)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .22s ease-out,--rx .22s ease-out,--ry .22s ease-out;will-change:transform}
.tl.act{transition:none}
.gl{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:soft-light;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.85),rgba(255,255,255,0) 58%)}
.act>.gl{opacity:1}
nav.navbar{transition:--rx .22s ease-out,--ry .22s ease-out}
nav.navbar.act{transition:none}
body{overscroll-behavior:none;background:var(--amb);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate}
.ambient{position:absolute;inset:-20%;z-index:-1;pointer-events:none;opacity:.55;filter:blur(60px);transition:opacity .6s}
.ambient::before,.ambient::after{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%}
.ambient::before{left:8%;top:12%;background:color-mix(in srgb,var(--sec) 45%,transparent)}
.ambient::after{right:4%;bottom:18%;background:color-mix(in srgb,var(--pri) 10%,transparent)}

/* Vidrio claro de esquinas cortadas */
.glass{position:relative;background:var(--glass);backdrop-filter:blur(7px) saturate(1.1);-webkit-backdrop-filter:blur(7px) saturate(1.1);
  border:1px solid var(--edge);
  border-radius:var(--rad);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.glass::before,.glass::after{content:"";position:absolute;width:var(--cut);height:var(--cut);pointer-events:none;
  background:linear-gradient(to bottom right,transparent calc(50% - .7px),var(--edge) 50%,transparent calc(50% + .7px))}
.glass::before{left:-1px;top:-1px}
.glass::after{right:-1px;bottom:-1px}

header.top{display:flex;align-items:center;gap:12px;padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:42px;height:42px;object-fit:cover;border-radius:10px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.02em}
.brand small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn-add{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;font-weight:700;border-radius:14px;background:var(--pri);color:var(--amb);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn-add svg{width:18px;height:18px}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

main{flex:1;position:relative;min-height:0}
.view{overscroll-behavior:contain;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:6px 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;font-weight:700}

/* Carrusel de vidrio con magnificación */
.carousel{overscroll-behavior-x:contain;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 30% 16px 0;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.carousel::-webkit-scrollbar{display:none}
.carousel{perspective:none}
.card{--rad:20px;flex:0 0 148px;scroll-snap-align:start;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;transform-origin:center center;
  transform:perspective(600px) rotateY(var(--cy,0deg)) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s,1));transition:transform .1s linear,--rx .22s ease-out,--ry .22s ease-out}
.card .gl{opacity:var(--go,0)}

.card .cover{width:100%;aspect-ratio:1}
.card b{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}

/* Portada generada: hexágonos Fare en la paleta */
.cover{position:relative;overflow:hidden;border-radius:12px;background:var(--pri);color:var(--amb);display:grid;place-items:center;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);max-width:100%}
.cover svg{position:absolute;inset:-10%;width:120%;height:120%;transform:rotate(var(--r,0deg))}
.cover svg path{fill:none;stroke:var(--sec);stroke-width:2}
.cover svg path.f{fill:color-mix(in srgb,var(--sec) 35%,transparent)}
.cover i{position:relative;font-style:normal;font-family:var(--display);font-weight:700;font-size:2.2em;line-height:1}

/* Lista */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--solid);outline:none;border-radius:14px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.search:focus{border-color:var(--sec)}
.list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.row{position:relative;--pp:900px;display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row .cover{border-radius:10px;width:46px;height:46px;font-size:.5rem}
.row .meta{min-width:0;cursor:pointer}
.row .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row .meta span{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .meta b{color:var(--sec)}
.row .dur{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.del{width:34px;height:34px;display:grid;place-items:center;color:var(--muted);font-size:.72rem;font-weight:700}
.del.ask{width:auto;padding:0 10px;border-radius:10px;background:var(--pri);color:var(--amb)}
.del svg{width:17px;height:17px}
.row .meta .tag,.tag{border-radius:6px;display:inline;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--sec);color:var(--sec);padding:1px 6px;margin-left:6px;vertical-align:1px}
.empty{border-radius:18px;padding:22px 18px;margin-top:14px;background:var(--solid);border:1px dashed var(--line);line-height:1.55;color:var(--muted)}
.empty b{color:var(--fg)}
.note{font-size:.8rem;color:var(--muted);line-height:1.5;margin:22px 0 0;max-width:60ch}

/* Sonando */
.np{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12px;max-width:440px;margin:0 auto}
.tilt{width:min(78vw,330px);aspect-ratio:1;max-width:100%;perspective:900px;touch-action:none}
.tilt-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;--pp:800px}
.tilt-in .cover{border-radius:22px;width:100%;height:100%;font-size:2rem;box-shadow:0 30px 60px -30px color-mix(in srgb,var(--pri) 60%,transparent)}
.tilt-in .gl{border-radius:22px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.tilt-in.idle:not(.act){animation:sway 8s ease-in-out infinite}
.tilt-in.idle:not(.act) .gl{opacity:.9}
@keyframes sway{0%,100%{--rx:9deg;--ry:-14deg;--gx:20%;--gy:15%}25%{--rx:-6deg;--ry:-6deg;--gx:35%;--gy:80%}50%{--rx:-10deg;--ry:15deg;--gx:85%;--gy:85%}75%{--rx:7deg;--ry:8deg;--gx:75%;--gy:20%}}
.np h2{margin:6px 0 0;font-family:var(--display);font-size:1.6rem;text-align:center;color:var(--pri);text-wrap:balance;letter-spacing:-.02em;line-height:1.15}
.np .artist{color:var(--muted);margin-top:-12px;text-align:center}
.seek{width:100%;display:grid;gap:6px}
.seek .times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--sec) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--sec) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;background:var(--pri);border:0;border-radius:5px;transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--pri);border:0;border-radius:0;transform:rotate(45deg)}
.controls{display:flex;align-items:center;justify-content:center;gap:22px}
.controls button{width:46px;height:46px;display:grid;place-items:center;color:var(--fg)}
.controls button svg{width:26px;height:26px}
.controls .play{border-radius:24px;width:74px;height:74px;background:var(--pri);color:var(--amb);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.controls .play svg{width:32px;height:32px}
.controls .mode{color:var(--muted);position:relative}
.controls .mode.on{color:var(--sec)}
.controls .mode b{position:absolute;right:6px;bottom:6px;font-size:.6rem;font-family:var(--mono)}

/* Paletas */
.bar7{display:flex;height:56px;border-radius:16px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar7 div{display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--mono);font-size:.7rem}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.pick label{border-radius:16px;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--solid);border:1px solid var(--line);font-size:.78rem;font-weight:700}
.pick label em{font-style:normal;font-weight:400;color:var(--muted);font-family:var(--mono)}
.pick input[type=color]{border-radius:10px;overflow:hidden;width:100%;height:40px;border:0;background:none;padding:0;cursor:pointer}
.save{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.save .search{flex:1;min-width:0;width:auto}
.err{color:var(--sec);font-size:.82rem;min-height:1.2em;margin:6px 0 0}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{border-radius:16px;position:relative;--pp:800px;display:flex;align-items:center;gap:10px;padding:12px 14px}
.plist li.glass{--cut:10px}
.plist li.op{background:var(--solid);border:1px solid var(--line)}
.plist .pn{flex:1;min-width:0;text-align:left;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .chk{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sec);font-weight:700}

/* Mini reproductor */
.mini{border-radius:18px;--pp:600px;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;z-index:5;background:var(--solid);border:1px solid var(--line);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.mini .cover{border-radius:10px;width:42px;height:42px;font-size:.45rem}
.mini .t{min-width:0;cursor:pointer;text-align:left}
.mini .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.mini .t span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:40px;height:40px;display:grid;place-items:center}
.mini .pp svg{width:24px;height:24px}
.mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--sec);width:var(--p,0%)}

/* Barra de navegación de vidrio con magnificación */
nav.navbar{position:fixed;left:50%;transform:translateX(-50%) perspective(600px) rotateX(var(--rx)) rotateY(var(--ry));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;
  display:flex;gap:6px;padding:8px 10px;--cut:16px;--rad:24px;width:max-content;max-width:calc(100% - 24px)}
nav.navbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;color:var(--muted);transform-origin:center bottom;transition:transform .12s ease-out,color .2s;font-size:.68rem;font-weight:700;letter-spacing:.06em}
nav.navbar button svg{width:24px;height:24px}
nav.navbar button[aria-current="page"]{color:var(--fg)}
nav.navbar button[aria-current="page"]::after{content:"";width:6px;height:6px;background:var(--sec);transform:rotate(45deg);margin-top:1px}

/* Barra de arriba flotante en liquid glass: la música pasa por detrás */
header.top.liquid{position:absolute;z-index:6;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  padding:8px 8px 8px 12px;border-radius:24px}
header.top .brand,header.top .btn-add{position:relative;z-index:3}
#v-lib{padding-top:86px}

/* Menú sencillo: bloques o líneas */
.btn-add.pill{clip-path:none;border-radius:999px;padding:10px 18px}
.seg{display:flex;justify-content:flex-end;margin:2px 0 12px}
.seg>div{display:inline-flex;padding:3px;border-radius:999px;background:var(--solid);border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--amb)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.grid .card{flex:none;min-width:0;padding:8px;gap:6px;--cut:12px}
.grid .card b{font-size:.84rem}
.grid .card span{font-size:.74rem;margin-top:-4px}
.card.on b{color:var(--sec)}
.card.act .gl{opacity:1}
.hint{color:var(--muted);font-size:.85rem;line-height:1.5;margin:14px 2px;list-style:none}
/* Playlist */
.plist .pn small{display:block;font-weight:400;font-size:.78rem;color:var(--muted);margin-top:2px}
.plist li.glass,.plist li.op{min-height:58px}
.mini-play{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--pri);color:var(--amb);flex:none}
.mini-play svg{width:20px;height:20px}
.plinfo{color:var(--muted);font-family:var(--mono);font-size:.8rem;margin:0 0 12px}
.pl-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.btn2{padding:10px 16px;border-radius:14px;background:var(--solid);border:1px solid var(--line);font-weight:700;font-size:.86rem}
.btn2.pri{background:var(--pri);color:var(--amb);border-color:var(--pri)}
.pl-actions .del{margin-left:auto}
.pick-row{display:grid;grid-template-columns:auto 42px minmax(0,1fr);gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.pick-row input{width:22px;height:22px;accent-color:var(--sec)}
.pick-row .cover{width:42px;height:42px;border-radius:10px;font-size:.45rem}
.pick-row label{min-width:0;cursor:pointer}
.pick-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-row span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Logo y barra solo en Biblioteca; las demás pantallas tienen botón para volver */
header.top{transition:opacity .25s,margin .3s}
.app:not([data-view="lib"]) header.top{display:none}
nav.navbar{translate:0 0;transition:translate .35s cubic-bezier(.2,.8,.2,1),opacity .25s,--rx .22s ease-out,--ry .22s ease-out}
/* La barra muestra siempre las 3 secciones, horizontal, abajo en el centro; la actual queda marcada. */

.mini{transition:bottom .35s cubic-bezier(.2,.8,.2,1)}

.back{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding-block:14px 10px;margin-bottom:4px;background:linear-gradient(var(--amb) 70%,transparent)}
.back span{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.bk{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--solid);border:1px solid var(--line)}
.bk svg{width:22px;height:22px}

/* Liquid glass: vidrio que refracta lo de atrás, con brillo en el borde. Solo en piezas flotantes (barra y mini reproductor). */
.liquid.liquid{
  --lgt:color-mix(in srgb,#ffffff 55%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,#ffffff 16%,transparent),transparent 45%),color-mix(in srgb,var(--amb) 22%,transparent);
  border:1px solid color-mix(in srgb,#ffffff 22%,var(--edge));
  backdrop-filter:blur(14px) saturate(1.8) brightness(1.06);-webkit-backdrop-filter:blur(14px) saturate(1.8) brightness(1.06);
  box-shadow:inset 0 1px 0 var(--lgt),inset 0 -1px 1px color-mix(in srgb,#ffffff 18%,transparent),inset 10px 10px 22px -16px var(--lgt),inset -10px -10px 22px -18px color-mix(in srgb,var(--pri) 30%,transparent)}
.lg-refract .liquid.liquid{backdrop-filter:url(#lg) blur(2px) saturate(1.8) brightness(1.06)}
.liquid .lsh{position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:2;
  background:radial-gradient(120% 70% at 20% -10%,rgba(255,255,255,.35),transparent 50%),radial-gradient(80% 60% at 110% 120%,rgba(255,255,255,.18),transparent 60%);mix-blend-mode:screen}
nav.navbar.liquid{transition:translate .35s cubic-bezier(.2,.8,.2,1),opacity .25s,scale .3s cubic-bezier(.3,1.6,.5,1)}
nav.navbar.liquid:active{scale:1.04 .96}
.mini.liquid:active{scale:.98 1.03}
.mini.liquid{transition:bottom .35s cubic-bezier(.2,.8,.2,1),scale .3s cubic-bezier(.3,1.6,.5,1)}

/* Impresora */
.printer{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(300px,calc(100% - 32px));z-index:20;cursor:pointer}
.slot{border-radius:10px;height:22px;background:var(--slot);position:relative;z-index:2;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.slot::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:3px;margin-top:-1px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.12)}
.paperwrap{overflow:hidden;margin:-11px 16px 0;padding-bottom:12px}
.ticket{position:relative;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:.74rem;line-height:1.55;padding:20px 16px 12px;transform:translateY(-105%)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/12px 8px,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/12px 8px}
.ticket h4{margin:0;text-align:center;font-size:.8rem;letter-spacing:.18em}
.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed var(--ink);opacity:.5;margin:8px 0}
.ticket .ln{display:flex;justify-content:space-between;gap:10px}
.ticket .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .bc{height:34px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 3px,var(--ink) 3px 4px,transparent 4px 7px,var(--ink) 7px 10px,transparent 10px 12px)}
.printer.go .ticket{animation:print 1.1s steps(9,end) forwards}
.printer.bye .ticket{animation:tear .45s ease-in forwards}
@keyframes print{from{transform:translateY(-105%)}to{transform:translateY(0)}}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(30px) rotate(3deg);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
  .printer.go .ticket{animation:none;transform:none}
}
</style>

/* ---------- Tilt 3D con brillo ---------- */
function bindTilt(el,max,area){

  const set=e=>{const r=area.getBoundingClientRect();if(!r.width)return;const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));

    el.style.setProperty('--gx',(x*100).toFixed(1)+'%');el.style.setProperty('--gy',(y*100).toFixed(1)+'%')};
  area.addEventListener('pointerdown',e=>{el.classList.add('act');set(e)});
  area.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||el.classList.contains('act')){el.classList.add('act');set(e)}});
  const off=()=>{el.classList.remove('act');el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')};
  ['pointerup','pointerleave','pointercancel'].forEach(v=>area.addEventListener(v,off));
}

/* ---------- Estirón al llegar al borde (stretch overscroll) ---------- */
function stretchy(el,axis){
  const Y=axis==='y';let last=null,pull=0,wt;
  const pos=t=>Y?t.clientY:t.clientX,size=()=>(Y?el.clientHeight:el.clientWidth)||1;
  const atStart=()=>(Y?el.scrollTop:el.scrollLeft)<=0;
  const atEnd=()=>Y?el.scrollTop+el.clientHeight>=el.scrollHeight-1:el.scrollLeft+el.clientWidth>=el.scrollWidth-1;
  const apply=()=>{const k=1+Math.min(.16,Math.abs(pull)/size()*.45);
    el.style.transformOrigin=pull>0?(Y?'50% 0':'0 50%'):(Y?'50% 100%':'100% 50%');el.style.transform=(Y?'scaleY(':'scaleX(')+k.toFixed(4)+')'};
  const release=()=>{last=null;if(!pull)return;const from=el.style.transform;pull=0;el.style.transform='';
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)el.animate([{transform:from},{transform:Y?'scaleY(1)':'scaleX(1)'}],{duration:480,easing:'cubic-bezier(.18,.9,.3,1.18)'})};
  el.addEventListener('touchstart',e=>{last=pos(e.touches[0]);pull=0},{passive:true});
  el.addEventListener('touchmove',e=>{if(last==null||e.touches.length>1)return;const p=pos(e.touches[0]),d=p-last;last=p;
    if(pull){const prev=pull;pull+=d*.6;if(prev*pull<=0){pull=0;el.style.transform='';return}apply();return}
    if((d>0&&atStart())||(d<0&&atEnd())){pull=d*.6;apply()}},{passive:true});
  el.addEventListener('touchend',release,{passive:true});el.addEventListener('touchcancel',release,{passive:true});
  el.addEventListener('wheel',e=>{const d=-(Y?e.deltaY:(e.deltaX||0));if(!d)return;
    if((d>0&&atStart())||(d<0&&atEnd())){pull=Math.max(-220,Math.min(220,pull+d*.4));apply();clearTimeout(wt);wt=setTimeout(release,140)}},{passive:true});
}

/* ---------- Pista de ejemplo (generada) ---------- */
let demoBlob=null;
function makeDemo(){
  if(demoBlob)return demoBlob;
  const sr=22050,dur=24,n=sr*dur,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const scale=[0,3,5,7,10,12,15],prog=[57,53,48,55],step=.25;
  for(let i=0;i<n;i++){const t=i/sr;const k=Math.floor(t/step),lt=t-k*step;const bar=Math.floor(t/2)%4;
    const note=prog[bar]+12+scale[(k*5+bar*2)%scale.length];const f=440*Math.pow(2,(note-69)/12);
    const env=Math.exp(-lt*9);let s=(Math.sin(2*Math.PI*f*t)+.3*Math.sin(4*Math.PI*f*t))*env*.32;
    const bt=t%2,bf=440*Math.pow(2,(prog[bar]-12-69)/12);s+=Math.sin(2*Math.PI*bf*t)*Math.exp(-bt*1.4)*.3;
    const fade=Math.min(1,t/1.5,(dur-t)/2.5);v.setInt16(44+i*2,Math.max(-1,Math.min(1,s*fade))*30000,true)}
  return demoBlob=new Blob([buf],{type:'audio/wav'});
}

/* ---------- Portada y datos que trae el archivo (ID3, FLAC, M4A) ---------- */
const MAGIC=[[0xFF,0xD8,0xFF,'image/jpeg'],[0x89,0x50,0x4E,'image/png'],[0x52,0x49,0x46,'image/webp']];
function findImg(b,from,to){to=Math.min(to,b.length-3);for(let i=from;i<to;i++)for(const m of MAGIC)if(b[i]===m[0]&&b[i+1]===m[1]&&b[i+2]===m[2])return [i,m[3]];return null}
function deUnsync(b){const o=[];for(let i=0;i<b.length;i++){o.push(b[i]);if(b[i]===0xFF&&b[i+1]===0)i++}return new Uint8Array(o)}
function txt(f){const enc=f[0];let d=f.subarray(1);
  try{if(enc===1||enc===2){return new TextDecoder(enc===1?'utf-16':'utf-16be').decode(d).replace(/\0+$/,'')}return new TextDecoder(enc===3?'utf-8':'latin1').decode(d).replace(/\0.*$/,'')}catch(e){return ''}}
async function readTags(blob){
  const out={};
  try{
    const head=new Uint8Array(await blob.slice(0,12).arrayBuffer());
    const S=(a,o,n)=>String.fromCharCode(...a.subarray(o,o+n));
    const ss=(a,o)=>(a[o]&127)<<21|(a[o+1]&127)<<14|(a[o+2]&127)<<7|(a[o+3]&127);
    const be=(a,o)=>((a[o]<<24)>>>0)+(a[o+1]<<16)+(a[o+2]<<8)+a[o+3];
    if(S(head,0,3)==='ID3'){
      const ver=head[3],flags=head[5],size=ss(head,6);
      let b=new Uint8Array(await blob.slice(10,10+size).arrayBuffer());
      if(flags&0x80&&ver<4)b=deUnsync(b);
      let p=0;if(flags&0x40)p=ver===4?ss(b,0):be(b,0)+4;
      while(p+10<=b.length){
        let id,fs,hd;
        if(ver===2){id=S(b,p,3);fs=b[p+3]<<16|b[p+4]<<8|b[p+5];hd=6}else{id=S(b,p,4);fs=ver===4?ss(b,p+4):be(b,p+4);hd=10}
        if(!/^[A-Z0-9]{3,4}$/.test(id)||fs<=0||p+hd+fs>b.length)break;
        let f=b.subarray(p+hd,p+hd+fs);
        if(ver===4&&(b[p+9]&2))f=deUnsync(f);
        if((id==='APIC'||id==='PIC')&&!out.art){const m=findImg(f,1,400);if(m)out.art=new Blob([f.slice(m[0])],{type:m[1]})}
        if((id==='TIT2'||id==='TT2')&&!out.title)out.title=txt(f).trim();
        if((id==='TPE1'||id==='TP1')&&!out.artist)out.artist=txt(f).trim();
        p+=hd+fs;
      }
    }else if(S(head,0,4)==='fLaC'){
      let o=4;
      for(let k=0;k<64;k++){const h=new Uint8Array(await blob.slice(o,o+4).arrayBuffer());if(h.length<4)break;
        const type=h[0]&127,len=h[1]<<16|h[2]<<8|h[3];
        if(type===6){const b=new Uint8Array(await blob.slice(o+4,o+4+len).arrayBuffer());const m=findImg(b,8,len);if(m){out.art=new Blob([b.slice(m[0])],{type:m[1]})}break}
        o+=4+len;if(h[0]&128)break}
    }else if(S(head,4,4)==='ftyp'&&blob.size<80e6){
      const b=new Uint8Array(await blob.arrayBuffer());
      for(let i=0;i<b.length-4;i++){if(b[i]===0x63&&b[i+1]===0x6F&&b[i+2]===0x76&&b[i+3]===0x72){const m=findImg(b,i+4,i+64);
        if(m){const len=be(b,i+4)-16;out.art=new Blob([b.slice(m[0],m[0]+Math.max(0,len)||undefined)],{type:m[1]})}break}}
    }
  }catch(e){}
  return out;
}
const artUrls=new Map();
const artUrl=s=>{if(!s||!s.art)return null;let u=artUrls.get(s.id);if(!u){u=URL.createObjectURL(s.art);artUrls.set(s.id,u)}return u};
const tints=new Map();
function tintOf(s){
  return new Promise(res=>{const u=artUrl(s);if(!u)return res(null);if(tints.has(s.id))return res(tints.get(s.id));
    const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(img,0,0,24,24);
      const d=x.getImageData(0,0,24,24).data;let R=0,G=0,B=0,W=0;
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),w=1+(mx-mn)/40;R+=r*w;G+=g*w;B+=b*w;W+=w}
      const t=rgb2hsl(R/W,G/W,B/W);tints.set(s.id,t);res(t)}catch(e){res(null)}};img.onerror=()=>res(null);img.src=u})
}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)}}
async function applyTint(s){
  const app=$('#app'),t=s?await tintOf(s):null;if(s&&s.id!==curId)return;
  if(!t){app.classList.remove('tinted');return}
  const sat=Math.min(70,t.s+10);
  app.style.setProperty('--npbg','hsl('+t.h+' '+Math.min(sat,55)+'% 20%)');
  app.style.setProperty('--npfg','hsl('+t.h+' '+Math.max(40,sat)+'% 86%)');
  app.style.setProperty('--npacc','hsl('+t.h+' '+Math.max(45,sat)+'% 62%)');
  app.classList.add('tinted');
}

  render();
  for(const s of songs.filter(x=>!x.tagsRead)){const tg=await readTags(s.blob);s.art=tg.art||null;s.tagsRead=true;
    if(tg.title&&s.artist==='Artista desconocido'){s.title=tg.title;if(tg.artist)s.artist=tg.artist}
    try{await DB.put(s)}catch(e){}}
  render();updateUI();
  takeInbox();
})();
})();
</script>

<script>if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}</script>
