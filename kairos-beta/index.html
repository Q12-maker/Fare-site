<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
@font-face{font-family:Cinzel;font-weight:400 700;font-display:swap;src:url(fonts/cinzel-500.woff2) format('woff2')}
:root{
  --negro:#020604; --fondo:#03110b; --verde:#0a4a30; --verde2:#0f6b45;
  --plata:#d9dddb; --neon:#22f58a; --neon2:#14c96e; --plata2:#9aa09d; --oro:#d8a94e; --esmeralda:#1fe39b;
  --corte:12px;
  --esq:clamp(96px, 27vmin, 320px);
  --logo:clamp(54px, 9vmin, 104px);
  --margen:clamp(12px, 2.4vmin, 26px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--negro);color:var(--plata);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}

/* ---------- Diapositiva 1: cuatro capas ---------- */
.escena{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%, #04140d 0%, var(--negro) 70%);touch-action:none;user-select:none;-webkit-user-select:none}

/* Capa 1: fondo negro + marca de agua */
.capa-fondo{position:absolute;inset:0;pointer-events:none}
.marca-agua{position:absolute;right:calc(var(--margen) + 1vmin);bottom:calc(var(--esq) * .25);font-family:Cinzel,serif;font-weight:600;
  font-size:clamp(64px, 17vmin, 220px);letter-spacing:.12em;line-height:1;color:rgba(217,221,219,.045);
  writing-mode:vertical-rl;transform:rotate(180deg);will-change:translate}

/* Capa 2: el mapa */
.capa-mapa{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.escena.moviendo .capa-mapa{cursor:grabbing}

/* Capa 3: el logo */
.logo{position:absolute;left:0;top:0;width:var(--logo);height:var(--logo);z-index:5;cursor:grab;touch-action:none;will-change:transform;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(34,245,138,.12));transition:filter .3s}
/* Ventana cuadrada Fare: vidrio con dos esquinas recortadas (arriba-izquierda y abajo-derecha) */
.logo .disco{position:absolute;inset:0;--c:clamp(8px, 18%, 16px);
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  background:linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.035) 45%, rgba(2,6,4,.55));
  backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(217,221,219,.16), inset 0 -10px 18px rgba(0,0,0,.4);
  transition:scale .3s, box-shadow .3s}
.logo img{position:absolute;inset:10%;width:80%;height:80%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.logo.agarrado{cursor:grabbing;filter:drop-shadow(0 22px 36px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(31,227,155,.3))}
.logo.agarrado .disco{scale:1.08;box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 0 1px rgba(31,227,155,.55), inset 0 -10px 18px rgba(0,0,0,.4)}

/* Capa 4: esquinas triangulares fijas (el mapa pasa por debajo) */
.esquina{position:absolute;width:var(--esq);height:var(--esq);pointer-events:none;z-index:4;filter:drop-shadow(0 0 22px rgba(0,0,0,.95)) drop-shadow(0 0 6px rgba(0,0,0,.9))}
.esquina .cuerpo{position:absolute;inset:0;
  background:linear-gradient(var(--ang), #020604 0%, #03110b 38%, rgba(4,22,14,.86) 47%, rgba(10,74,48,.55) 50%);
  backdrop-filter:blur(7px) saturate(1.3);-webkit-backdrop-filter:blur(7px) saturate(1.3)}
.esquina svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.esquina.ar{top:0;right:0;--ang:225deg}
.esquina.ar .cuerpo{clip-path:polygon(0 0,100% 0,100% 100%)}
.esquina.ab{bottom:0;left:0;--ang:45deg}
.esquina.ab .cuerpo{clip-path:polygon(0 0,100% 100%,0 100%)}

/* ---------- Barra superior (del boceto): barra larga + caja de 3 botones ---------- */
.barra{position:absolute;z-index:6;top:var(--margen);left:calc(var(--margen) * 2 + var(--logo));right:calc(var(--margen) + min(var(--esq) * .55, 170px));display:flex;gap:10px;align-items:stretch;pointer-events:none}
.vidrio{background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.025) 45%, rgba(255,255,255,.05));
  backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(217,221,219,.12), 0 10px 30px rgba(0,0,0,.45)}
.corte{clip-path:polygon(var(--corte) 0,100% 0,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,0 100%,0 var(--corte))}
.larga{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;height:48px;pointer-events:auto}
.larga .titulo{color:var(--neon);text-shadow:0 0 14px rgba(34,245,138,.35);font-family:Cinzel,serif;letter-spacing:.22em;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.larga .titulo small{text-shadow:none;font-family:Manrope,sans-serif;letter-spacing:.14em;font-size:.66rem;color:var(--plata2);margin-left:10px;text-transform:uppercase}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;color:var(--plata);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s, color .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{color:#fff}
.btn:active{transform:scale(.95)}
.btn-largo{--corte:9px;height:34px;padding:0 16px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(31,227,155,.35), 0 0 18px rgba(31,227,155,.12)}
.caja{display:flex;align-items:center;gap:6px;padding:0 7px;height:48px;pointer-events:auto}
.redondo{width:36px;height:36px;border-radius:50%;font-size:1.05rem;line-height:1}
.redondo svg{width:16px;height:16px}

/* Atribución del mapa (obligatoria) y pista */
.atrib{position:absolute;z-index:6;right:var(--margen);bottom:calc(var(--margen) * .6);font-size:.66rem;color:var(--plata2);opacity:.85;pointer-events:auto}
.atrib a{color:inherit}
.pista{position:absolute;z-index:6;left:50%;bottom:calc(var(--margen) * 1.6);translate:-50% 0;--corte:8px;padding:9px 16px;font-size:.72rem;letter-spacing:.08em;color:var(--plata);white-space:nowrap;pointer-events:none;transition:opacity .8s, translate .8s}
.pista.oculta{opacity:0;translate:-50% 12px}

@media (max-width:640px){
  .larga .titulo small{text-shadow:none;display:none}
  .larga{padding-left:12px;height:44px}.caja{height:44px}
  .barra{left:calc(var(--margen) * 2 + var(--logo));right:var(--margen);top:calc(var(--margen) + env(safe-area-inset-top))}
  .redondo{width:32px;height:32px}
  .btn-largo{padding:0 11px;letter-spacing:.08em}
}
@media (max-width:420px){ .larga .titulo{display:none} .larga{flex:0 0 auto;padding:0 6px} .barra{justify-content:flex-end} }
@media (prefers-reduced-motion:reduce){ .btn::after{display:none} }
</style>
</head>
<body>
<main class="escena" id="escena" aria-label="Kairos, mapa de Mariquita">
  <!-- Capa 1 -->
  <div class="capa-fondo" aria-hidden="true"><div class="marca-agua" id="marcaAgua">KAIROS</div></div>
  <!-- Capa 2 -->
  <canvas class="capa-mapa" id="mapa" role="img" aria-label="Mapa de las calles de Mariquita, Tolima"></canvas>
  <!-- Capa 4 -->
  <div class="esquina ar" aria-hidden="true"><div class="cuerpo"></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#1fe39b" stroke-opacity=".75" stroke-width="1.6" vector-effect="non-scaling-stroke"/><line x1="16" y1="0" x2="100" y2="84" stroke="#d9dddb" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="esquina ab" aria-hidden="true"><div class="cuerpo"></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#1fe39b" stroke-opacity=".75" stroke-width="1.6" vector-effect="non-scaling-stroke"/><line x1="0" y1="16" x2="84" y2="100" stroke="#d9dddb" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></div>
  <!-- Capa 3 -->
  <div class="logo" id="logo" role="img" aria-label="Logo de Kairos (reloj de arena), se puede arrastrar"><div class="disco"></div><img src="logo-kairos.svg" alt="" draggable="false"></div>

  <header class="barra">
    <div class="larga vidrio corte">
      <span class="titulo">KAIROS<small>Marketing y branding</small></span>
      <a class="btn btn-largo vidrio corte" id="wa" href="https://wa.me/573159515688?text=Hola%20Kairos%2C%20quiero%20informaci%C3%B3n." target="_blank" rel="noopener">Escríbenos</a>
    </div>
    <div class="caja vidrio corte" role="group" aria-label="Controles del mapa">
      <button class="btn redondo vidrio" id="menos" aria-label="Alejar el mapa">−</button>
      <button class="btn redondo vidrio" id="mas" aria-label="Acercar el mapa">+</button>
      <button class="btn redondo vidrio" id="centro" aria-label="Volver al centro de Mariquita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
  </header>

  <div class="pista vidrio corte" id="pista">Mueve el mapa</div>
  <div class="atrib">Mapa: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores de OpenStreetMap</a></div>
</main>

<script>
(()=>{
'use strict';
const escena=document.getElementById('escena'), lienzo=document.getElementById('mapa'), ctx=lienzo.getContext('2d');
const logo=document.getElementById('logo'), marca=document.getElementById('marcaAgua'), pista=document.getElementById('pista');
const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1;

/* ---------- Datos del mapa (OpenStreetMap, en metros desde el centro) ---------- */
const PLAZA=[-305,-5];             // Plaza Mayor José Celestino Mutis
const CENTRO=[150,160];            // centro de la vista: plaza + barrios
const estilos={
  parque:{fill:'rgba(15,107,69,.20)'},
  agua:{c:'rgba(20,201,110,.40)',w:3.2},
  trunk:{c:'rgba(216,169,78,.85)',w:2.6,brillo:'rgba(216,169,78,.16)'},
  principal:{c:'rgba(217,221,219,.62)',w:1.9},
  calle:{c:'rgba(34,245,138,.62)',w:1.1},
  servicio:{c:'rgba(15,107,69,.85)',w:.9},
  sendero:{c:'rgba(154,160,157,.40)',w:.8,raya:[6,5]},
  tren:{c:'rgba(154,160,157,.55)',w:1.2,raya:[10,6]}
};
function grupo(t){
  if(t==='parque')return'parque'; if(t.startsWith('agua'))return'agua'; if(t==='tren')return'tren';
  if(/^trunk|^primary|^motorway/.test(t))return'trunk';
  if(/^secondary|^tertiary/.test(t))return'principal';
  if(/residential|unclassified|living_street|pedestrian/.test(t))return'calle';
  if(/service|services/.test(t))return'servicio';
  return'sendero';
}
const caminos={}; let listo=false;
function cargar(datos){
  for(const k in estilos)caminos[k]=new Path2D();
  for(const [tipo,,p] of datos.vias){
    const g=grupo(tipo), P=caminos[g];
    P.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2)P.lineTo(p[i],p[i+1]);
    if(g==='parque')P.closePath();
  }
  listo=true;
}
(window.MAPA_MARIQUITA?Promise.resolve(window.MAPA_MARIQUITA):fetch('datos/mapa-mariquita.json').then(r=>r.json())).then(cargar).catch(()=>{});

/* ---------- Vista: lo que el usuario mueve + el movimiento solo ---------- */
const vista={x:CENTRO[0],y:CENTRO[1],z:1};      // z = acercamiento sobre la escala base
const meta={x:CENTRO[0],y:CENTRO[1],z:1};       // a dónde va (suavizado)
let base=1;                                     // píxeles por metro con z=1
let amp=1, ultimoToque=-1e9;                    // fuerza del movimiento solo
const par={x:0,y:0}, parMeta={x:0,y:0};         // paralaje del cursor (-1..1)

function medir(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  lienzo.width=Math.round(W*DPR); lienzo.height=Math.round(H*DPR);
  base=Math.max(W,H)/2300;
  colocarLogo(true);
}
addEventListener('resize',medir);

function deriva(t){
  // Como las franjas de luz de Stylo: lento, continuo y sin repetirse a simple vista.
  const s=t/1000;
  return{
    x:420*Math.sin(s/23)+160*Math.sin(s/9.7+1.3),
    y:300*Math.sin(s/29+.8)+110*Math.cos(s/13.1),
    r:.075*Math.sin(s/37),
    z:1+.07*Math.sin(s/19+2)
  };
}

function dibujar(t){
  const k=.12;
  vista.x+=(meta.x-vista.x)*k; vista.y+=(meta.y-vista.y)*k; vista.z+=(meta.z-vista.z)*k;
  par.x+=(parMeta.x-par.x)*.06; par.y+=(parMeta.y-par.y)*.06;
  // el movimiento solo se apaga mientras alguien toca y vuelve suave a los 4 s
  const objetivo=(quieto||t-ultimoToque<4000)?0:1; amp+=(objetivo-amp)*.02;
  const d=quieto?{x:0,y:0,r:0,z:1}:deriva(t);
  const esc=base*vista.z*(1+(d.z-1)*amp), rot=d.r*amp;
  const cx=vista.x+d.x*amp/Math.max(vista.z,1), cy=vista.y+d.y*amp/Math.max(vista.z,1);
  const px=W/2-par.x*22, py=H/2-par.y*16;     // el mapa se va al lado contrario del cursor
  marca.style.translate=`${-par.x*7}px ${-par.y*5}px`;

  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,lienzo.width,lienzo.height);
  if(!listo)return;
  const c=Math.cos(rot)*esc*DPR, s=Math.sin(rot)*esc*DPR;
  ctx.setTransform(c,s,-s,c,px*DPR-(c*cx-s*cy),py*DPR-(s*cx+c*cy));
  const u=1/esc, grosor=Math.min(1.8,Math.max(.75,Math.sqrt(vista.z)));
  ctx.lineCap='round'; ctx.lineJoin='round';

  // cuadrícula de libreta (como el papel del boceto), parte del mapa
  const paso=100, r=Math.hypot(W,H)/esc*.6+paso;
  ctx.beginPath();
  for(let gx=Math.floor((cx-r)/paso)*paso;gx<cx+r;gx+=paso){ctx.moveTo(gx,cy-r);ctx.lineTo(gx,cy+r)}
  for(let gy=Math.floor((cy-r)/paso)*paso;gy<cy+r;gy+=paso){ctx.moveTo(cx-r,gy);ctx.lineTo(cx+r,gy)}
  ctx.strokeStyle='rgba(217,221,219,.035)'; ctx.lineWidth=u; ctx.stroke();

  ctx.fillStyle=estilos.parque.fill; ctx.fill(caminos.parque);
  for(const g of['agua','sendero','tren','servicio','calle','principal','trunk']){
    const e=estilos[g];
    if(e.brillo){ctx.strokeStyle=e.brillo; ctx.lineWidth=e.w*4*u*grosor; ctx.setLineDash([]); ctx.stroke(caminos[g]);}
    ctx.strokeStyle=e.c; ctx.lineWidth=e.w*u*grosor; ctx.setLineDash(e.raya?e.raya.map(v=>v*u):[]);
    ctx.stroke(caminos[g]);
  }
  ctx.setLineDash([]);
  // punto de la plaza: latido esmeralda
  const pulso=(t/1600)%1;
  ctx.beginPath(); ctx.arc(PLAZA[0],PLAZA[1],(4+18*pulso)*u,0,7); ctx.strokeStyle=`rgba(31,227,155,${.6*(1-pulso)})`; ctx.lineWidth=1.5*u; ctx.stroke();
  ctx.beginPath(); ctx.arc(PLAZA[0],PLAZA[1],3.5*u,0,7); ctx.fillStyle='#1fe39b'; ctx.fill();
}

/* ---------- Gestos sobre el mapa: 1 dedo/ratón mueve, 2 dedos o rueda acercan ---------- */
const dedos=new Map(); let ultimo=null;
const ZMIN=.45, ZMAX=9;
function aMundo(dx,dy){const e=base*vista.z; return[dx/e,dy/e]}
function zoomEn(f,sx,sy){
  const z0=meta.z, z1=Math.min(ZMAX,Math.max(ZMIN,z0*f)); if(z1===z0)return;
  const e0=base*z0, e1=base*z1, ox=sx-W/2, oy=sy-H/2;
  meta.x+=ox/e0-ox/e1; meta.y+=oy/e0-oy/e1; meta.z=z1;
}
function tocado(){ultimoToque=performance.now(); pista.classList.add('oculta')}
function estado(){
  const p=[...dedos.values()];
  if(p.length===1)return{x:p[0].x,y:p[0].y,d:0};
  const [a,b]=p; return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};
}
lienzo.addEventListener('pointerdown',e=>{
  lienzo.setPointerCapture(e.pointerId); dedos.set(e.pointerId,{x:e.clientX,y:e.clientY});
  ultimo=estado(); escena.classList.add('moviendo'); tocado();
});
lienzo.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){parMeta.x=e.clientX/W*2-1; parMeta.y=e.clientY/H*2-1}
  if(!dedos.has(e.pointerId))return;
  dedos.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(dedos.size>2)return;
  const a=estado();
  if(ultimo){
    const [mx,my]=aMundo(a.x-ultimo.x,a.y-ultimo.y); meta.x-=mx; meta.y-=my; vista.x-=mx; vista.y-=my;
    if(a.d&&ultimo.d)zoomEn(a.d/ultimo.d,a.x,a.y);
  }
  ultimo=a; tocado();
});
function soltar(e){dedos.delete(e.pointerId); ultimo=dedos.size?estado():null; if(!dedos.size)escena.classList.remove('moviendo')}
lienzo.addEventListener('pointerup',soltar); lienzo.addEventListener('pointercancel',soltar);
lienzo.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){parMeta.x=0;parMeta.y=0}});
lienzo.addEventListener('wheel',e=>{e.preventDefault(); zoomEn(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY); tocado()},{passive:false});
lienzo.addEventListener('dblclick',e=>{zoomEn(1.8,e.clientX,e.clientY); tocado()});
document.getElementById('mas').onclick=()=>{zoomEn(1.5,W/2,H/2);tocado()};
document.getElementById('menos').onclick=()=>{zoomEn(1/1.5,W/2,H/2);tocado()};
document.getElementById('centro').onclick=()=>{meta.x=CENTRO[0];meta.y=CENTRO[1];meta.z=1;ultimoToque=performance.now()-2500};
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&e.target!==lienzo){parMeta.x=e.clientX/W*2-1; parMeta.y=e.clientY/H*2-1}});

/* ---------- Logo arrastrable: vuelve a su sitio al soltarlo ---------- */
const L={x:0,y:0,casaX:0,casaY:0,agarrado:false,offX:0,offY:0,vx:0,ultX:0,ultT:0,id:null};
function colocarLogo(saltar){
  const m=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--margen'))||16;
  L.casaX=m; L.casaY=m+(parseFloat(getComputedStyle(document.body).getPropertyValue('padding-top'))||0);
  if(saltar&&!L.agarrado){L.x=L.casaX; L.y=L.casaY; pintarLogo()}
}
function pintarLogo(){logo.style.transform=`translate3d(${L.x+par.x*6}px,${L.y+par.y*5}px,0)`}
logo.addEventListener('pointerdown',e=>{
  e.preventDefault(); logo.setPointerCapture(e.pointerId); L.id=e.pointerId;
  L.agarrado=true; L.offX=e.clientX-L.x; L.offY=e.clientY-L.y; L.ultX=e.clientX; L.ultT=performance.now(); L.vx=0;
  logo.classList.add('agarrado'); logo.style.transition='none'; tocado();
});
logo.addEventListener('pointermove',e=>{
  if(!L.agarrado||e.pointerId!==L.id)return;
  const s=logo.offsetWidth;
  L.x=Math.min(W-s,Math.max(0,e.clientX-L.offX)); L.y=Math.min(H-s,Math.max(0,e.clientY-L.offY));
  const now=performance.now(), dt=Math.max(1,now-L.ultT), v=(e.clientX-L.ultX)/dt;
  L.vx=L.vx*.6+v*.4; L.ultX=e.clientX; L.ultT=now;
  pintarLogo();
});
function soltarLogo(e){
  if(!L.agarrado||e.pointerId!==L.id)return;
  L.agarrado=false; logo.classList.remove('agarrado');
  logo.style.transition='transform .75s cubic-bezier(.34,1.45,.55,1)';
  L.x=L.casaX; L.y=L.casaY; pintarLogo();
  setTimeout(()=>{if(!L.agarrado)logo.style.transition='none'},800);
}
logo.addEventListener('pointerup',soltarLogo); logo.addEventListener('pointercancel',soltarLogo);

/* ---------- Bucle ---------- */
logo.style.transition='none';
medir();
function bucle(t){dibujar(t); if(!L.agarrado&&logo.style.transition==='none')pintarLogo(); requestAnimationFrame(bucle)}
requestAnimationFrame(bucle);
setTimeout(()=>pista.classList.add('oculta'),9000);

if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.MAPA_MARIQUITA)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
